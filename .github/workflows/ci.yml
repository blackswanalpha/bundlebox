name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ${{ matrix.os }}
    # Windows GATES, as of 0.3.0. It was best-effort while the two engines picked
    # different shells there and `the kernel and the JS engine agree about a run
    # step with body keys` was red on every Windows job — a red that could not
    # fail a build, and therefore went unnoticed for as long as the log history
    # goes back. One shell selection (`exec.shellCmd`, mirroring
    # kernel/src/gate.rs) fixed it, and with the flag gone a Windows break is a
    # failed build again rather than a green workflow over a red job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - name: build kernel
        run: cargo build --release --manifest-path kernel/Cargo.toml
      - name: install kernel for the tests
        shell: bash
        run: mkdir -p ~/.bundlebox/bin && cp kernel/target/release/bbk* ~/.bundlebox/bin/ || true
      # arc, for the same reason the kernel is built: `test/echos.test.js` proves
      # the Rust echos and `src/echos/fallback.js` answer identically, and it can
      # only do that against a binary. Without this step both agreement tests
      # skipped on every runner since they were written, and `arc` drifted two
      # revisions from the JS with no job ever going red. Left where it is,
      # AFTER checkout, so the binary is newer than the sources it was built
      # from and the staleness guard in that test passes.
      - name: build arc
        run: cargo build --release --manifest-path arc/Cargo.toml
      - run: npm run lint
        shell: bash
      - run: npm test
      # A skip nobody reads is how the drift above survived. `npm test` is green
      # whether those two tests compared the implementations or declined to, so
      # this asserts they ran: a workflow that builds arc has to prove the
      # comparison happened.
      - name: the arc/JS echo agreement ran, rather than skipping
        shell: bash
        run: |
          # pipefail, because a pipeline reports tee's status and a failing test
          # would leave this step green: the exact shape this box has a detector
          # for. $RUNNER_TEMP rather than /tmp, which is not a path on Windows.
          set -o pipefail
          node --test test/echos.test.js | tee "$RUNNER_TEMP/echos-ci.txt"
          if grep -q "SKIP arc" "$RUNNER_TEMP/echos-ci.txt"; then
            echo "::error::the arc agreement tests skipped; arc did not build, or is older than arc/src"
            exit 1
          fi
      - run: npm run expert:test
      - run: node bin/bb.js selftest
      # bash on every platform: PowerShell has no /dev/null and reads it as a
      # relative path, so this step died with `Could not find a part of the path
      # 'D:\dev\null'` the moment the Windows tests started passing and it was
      # finally reached. Two steps above already pin the shell for the same reason.
      - run: node bin/bb.js scan --json > /dev/null
        shell: bash
      - name: doc-drift on our own README
        run: node bin/bb.js scan --only doc-drift
      # The corpus over `bb` itself. `check` validates every scenario with no
      # server and no requests, so it runs on all three platforms; the HTTP half
      # needs the console up and runs on Linux only.
      - run: node bin/bb.js cookbook check
        shell: bash
      - name: the bb corpus against a running console
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node bin/bb.js console serve --port 7788 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7788/health >/dev/null && break; sleep 1; done
          node bin/bb.js cookbook run --persona bb --base http://127.0.0.1:7788
          node bin/bb.js simulate run smoke --base http://127.0.0.1:7788
      # The ablation. It asserts nothing about the percentage — that is a
      # property of this tree — only that both arms still measure something and
      # that the run is deterministic. A bench that silently starts returning
      # zero is the failure this catches.
      - name: the ablation bench still measures both arms
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node bin/bb.js bench init
          node bin/bb.js bench run --json > /tmp/bench-a.json
          node bin/bb.js bench run --json > /tmp/bench-b.json
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("/tmp/bench-a.json", "utf8")).totals;
            const b = JSON.parse(fs.readFileSync("/tmp/bench-b.json", "utf8")).totals;
            if (!(a.bare > 0 && a.packed > 0)) { console.error("an arm measured nothing:", a); process.exit(1); }
            if (a.bare !== b.bare || a.packed !== b.packed) { console.error("not deterministic:", a, b); process.exit(1); }
            console.log(`bench ok: bare ${a.bare}, packed ${a.packed}, ${a.saved_pct}% over ${a.measured} task(s)`);
          '
      - name: every eval holds
        if: runner.os == 'Linux'
        shell: bash
        run: node bin/bb.js frames check
